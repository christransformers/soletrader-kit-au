<!--{"title":"GST Calculator Australia — Add or Remove 10% GST | Sole Trader Kit AU","desc":"Free Australian GST calculator. Add 10% GST to a price or work out the GST included in a GST-inclusive amount (one-eleventh)."}-->
<section class="hero"><h1>GST calculator (Australia)</h1><p>Australian GST is 10%. To find the GST inside a GST-inclusive price, divide by 11.</p></section>
<div class="card" style="max-width:560px"><label for="amt">Amount (A$)</label><input id="amt" type="number" step="0.01" value="100" inputmode="decimal">
<label for="mode">Calculation</label><select id="mode"><option value="add">Add GST (amount is ex-GST)</option><option value="remove">Remove GST (amount includes GST)</option></select>
<div class="result" id="out"></div></div>
<script>
function f(n){return n.toLocaleString('en-AU',{style:'currency',currency:'AUD'})}
function calc(){var a=parseFloat(amt.value)||0,ex,g,inc;if(mode.value==='add'){ex=a;g=a*0.1;inc=a+g}else{inc=a;g=a/11;ex=a-g}
out.innerHTML='Ex-GST: <b>'+f(ex)+'</b><br>GST: <b>'+f(g)+'</b><br><span class="big">Total incl. GST: '+f(inc)+'</span>'}
amt.oninput=mode.onchange=calc;calc();
</script>
<p class="muted">Rounding: totals are shown to the cent. Check the ATO's rounding rules for invoices with many lines.</p>
