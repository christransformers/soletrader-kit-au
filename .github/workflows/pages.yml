name: Build & deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
  schedule: [{ cron: "0 20 * * 1" }]   # weekly rebuild (refreshes sitemap lastmod)
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build.js
      - name: Render OG image (Chrome is preinstalled on ubuntu-latest)
        run: google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1200,630 --screenshot=assets/og.png "file://$PWD/assets/og.html" || true
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: d
        uses: actions/deploy-pages@v4
